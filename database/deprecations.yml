deprecations:
  - id: update_attributes
    pattern: "\\bupdate_attributes!?\\b"
    message: "'update_attributes' was removed in Rails 6.1. Use 'update' instead."
    removed_in: "6.1"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_1_release_notes.html#active-record-removals"
    recategorization: "Rails 6.0 -> 6.1"
    fix_effort: low
  - id: controller_test_positional_params
    # `get :show, id: 1` or `post :create, :user => {...}`; keyword args such as params: are fine
    pattern: "^\\s*(get|post|put|patch|delete|head)\\s*\\(?\\s*:\\w+\\s*,\\s*(?:(?!(?:params|session|flash|format|xhr|as|headers|body|method):)\\w+:|:\\w+\\s*=>)"
    message: "Controller test passes request parameters positionally. Since Rails 5.1 they must be keyword arguments, e.g. get :show, params: { id: 1 }."
    removed_in: "5.1"
    severity: error
    confidence: "Medium"
    guide_link: "https://guides.rubyonrails.org/5_1_release_notes.html#action-pack-removals"
    recategorization: "Rails 5.0 -> 5.1"
    fix_effort: low
    paths: [test, spec]
  - id: application_secrets
    pattern: "\\bRails\\.application\\.secrets\\b"
    message: "'Rails.application.secrets' was removed in Rails 7.2. Use credentials, or Rails.application.config_for for non-secret settings."
    removed_in: "7.2"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_2_release_notes.html#railties-removals"
    recategorization: "Rails 7.1 -> 7.2"
    fix_effort: medium
  - id: controller_force_ssl
    pattern: "^\\s*force_ssl\\b"
    message: "'force_ssl' at the controller level was removed in Rails 6.1. Use 'config.force_ssl' to force HTTPS for the whole app."
    removed_in: "6.1"
    severity: error
    confidence: "Medium"
    guide_link: "https://guides.rubyonrails.org/6_1_release_notes.html#action-pack-removals"
    recategorization: "Rails 6.0 -> 6.1"
    fix_effort: medium
    paths: [app]
  - id: actionmailer_delivery_job
    pattern: "\\bActionMailer::(?:Parameterized::)?DeliveryJob\\b"
    message: "'ActionMailer::DeliveryJob' and 'ActionMailer::Parameterized::DeliveryJob' were removed in Rails 7.0. Mail is delivered by 'ActionMailer::MailDeliveryJob'."
    removed_in: "7.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_0_release_notes.html#action-mailer-removals"
    recategorization: "Rails 6.1 -> 7.0"
    fix_effort: low
  - id: allow_unsafe_raw_sql
    pattern: "\\ballow_unsafe_raw_sql\\b"
    message: "'ActiveRecord::Base.allow_unsafe_raw_sql' was removed in Rails 7.0. Wrap raw SQL in 'Arel.sql' where you need it."
    removed_in: "7.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_0_release_notes.html#active-record-removals"
    recategorization: "Rails 6.1 -> 7.0"
    fix_effort: medium
  - id: legacy_connection_handling
    pattern: "\\blegacy_connection_handling\\b"
    message: "'ActiveRecord.legacy_connection_handling' was removed in Rails 7.1. Delete the setting; the new connection handling is the only one left."
    removed_in: "7.1"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_1_release_notes.html#active-record-removals"
    recategorization: "Rails 7.0 -> 7.1"
    fix_effort: low
  - id: active_record_partial_writes
    pattern: "\\bpartial_writes\\b"
    message: "'config.active_record.partial_writes' was removed in Rails 7.1. Use 'partial_inserts' and 'partial_updates' instead."
    removed_in: "7.1"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_1_release_notes.html#active-record-removals"
    recategorization: "Rails 7.0 -> 7.1"
    fix_effort: low
  - id: per_thread_registry
    pattern: "\\bActiveSupport::PerThreadRegistry\\b"
    message: "'ActiveSupport::PerThreadRegistry' was removed in Rails 7.1. Use thread-local or fiber-local attributes directly."
    removed_in: "7.1"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_1_release_notes.html#active-support-removals"
    recategorization: "Rails 7.0 -> 7.1"
    fix_effort: medium
  - id: clear_connections
    pattern: "(?<!connection_handler\\.)\\b(?:clear_active_connections!|clear_reloadable_connections!|clear_all_connections!|flush_idle_connections!)"
    message: "'ActiveRecord::Base.clear_active_connections!', 'clear_reloadable_connections!', 'clear_all_connections!' and 'flush_idle_connections!' were removed in Rails 7.2. Call the same methods on a connection handler, e.g. 'ActiveRecord::Base.connection_handler.clear_active_connections!'."
    removed_in: "7.2"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_2_release_notes.html#active-record-removals"
    recategorization: "Rails 7.1 -> 7.2"
    fix_effort: low
  - id: migration_check_pending
    pattern: "ActiveRecord::Migration\\.check_pending!?\\b"
    message: "'ActiveRecord::Migration.check_pending' was removed in Rails 7.2. Use 'ActiveRecord::Migration.check_all_pending!'."
    removed_in: "7.2"
    severity: error
    confidence: "Medium"
    guide_link: "https://guides.rubyonrails.org/7_2_release_notes.html#active-record-removals"
    recategorization: "Rails 7.1 -> 7.2"
    fix_effort: low
  - id: fixture_path_assignment
    pattern: "\\bfixture_path\\s*="
    message: "'fixture_path' was removed in Rails 7.2. Assign 'fixture_paths' instead, which takes an array."
    removed_in: "7.2"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/7_2_release_notes.html#active-record-removals"
    recategorization: "Rails 7.1 -> 7.2"
    fix_effort: low
    paths: [test, spec]
  - id: halt_callback_chains_on_return_false
    pattern: "\\bhalt_callback_chains_on_return_false\\b"
    message: "'halt_callback_chains_on_return_false' was removed in Rails 5.2. Halt a callback chain with 'throw :abort'."
    removed_in: "5.2"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/5_2_release_notes.html#active-support-removals"
    recategorization: "Rails 5.1 -> 5.2"
    fix_effort: medium
  - id: string_callback_conditions
    pattern: "(?:\\b(?:if|unless):|:(?:if|unless)\\s*=>)\\s*[\"']"
    message: "String conditions for ':if' and ':unless' on callbacks were removed in Rails 5.2. Use a symbol or a lambda, e.g. if: -> { draft? }."
    removed_in: "5.2"
    severity: error
    confidence: "Medium"
    guide_link: "https://guides.rubyonrails.org/5_2_release_notes.html#active-support-removals"
    recategorization: "Rails 5.1 -> 5.2"
    fix_effort: low
    paths: [app, lib]
  - id: params_parser_parse_error
    pattern: "\\bActionController::ParamsParser\\b"
    message: "'ActionController::ParamsParser::ParseError' was removed in Rails 5.2. Rescue 'ActionDispatch::Http::Parameters::ParseError' instead."
    removed_in: "5.2"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/5_2_release_notes.html#action-pack-removals"
    recategorization: "Rails 5.1 -> 5.2"
    fix_effort: low
  - id: secret_token
    pattern: "\\.secret_token\\b"
    message: "'config.secret_token' was removed in Rails 6.0. Use 'secret_key_base', held in credentials."
    removed_in: "6.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_0_release_notes.html#railties-removals"
    recategorization: "Rails 5.2 -> 6.0"
    fix_effort: medium
  - id: image_alt_helper
    pattern: "\\bimage_alt\\b"
    message: "The 'image_alt' helper was removed in Rails 6.0. Pass the alt text to 'image_tag' yourself."
    removed_in: "6.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_0_release_notes.html#action-view-removals"
    recategorization: "Rails 5.2 -> 6.0"
    fix_effort: low
  - id: record_tag_helper
    pattern: "\\b(?:div_for|content_tag_for)\\b"
    message: "'div_for' and 'content_tag_for' were removed in Rails 6.0 along with RecordTagHelper. Use 'content_tag' with 'dom_id', or the record_tag_helper gem."
    removed_in: "6.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_0_release_notes.html#action-view-removals"
    recategorization: "Rails 5.2 -> 6.0"
    fix_effort: medium
  - id: fragment_cache_key
    pattern: "\\bfragment_cache_key\\b"
    message: "The 'fragment_cache_key' helper was removed in Rails 6.0. Use 'combined_fragment_cache_key'."
    removed_in: "6.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_0_release_notes.html#action-pack-removals"
    recategorization: "Rails 5.2 -> 6.0"
    fix_effort: low
  - id: test_response_success
    pattern: "\\bresponse\\.(?:success\\?|missing\\?|error\\?)"
    message: "'response.success?', '#missing?' and '#error?' were removed from TestResponse in Rails 6.0. Use 'successful?', 'not_found?' and 'server_error?'."
    removed_in: "6.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/6_0_release_notes.html#action-pack-removals"
    recategorization: "Rails 5.2 -> 6.0"
    fix_effort: low
    paths: [test, spec]
  - id: enum_keyword_arguments
    pattern: "^\\s*enum\\s+[a-z_]+:"
    message: "Defining 'enum' with keyword arguments was removed in Rails 8.0. Pass the name positionally, e.g. enum :status, { pending: 0 }."
