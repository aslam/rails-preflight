    fix_effort: low
  - id: read_encrypted_secrets
    pattern: "\\bread_encrypted_secrets\\b"
    message: "'config.read_encrypted_secrets' was removed in Rails 8.0. Encrypted secrets were replaced by credentials."
    removed_in: "8.0"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/8_0_release_notes.html#railties-removals"
