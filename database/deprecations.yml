  - id: benchmark_ms
    pattern: "\\bBenchmark\\.ms\\b"
    message: "'Benchmark.ms' was removed in Rails 8.1. Use 'Benchmark.realtime' and convert, or the benchmark gem."
    removed_in: "8.1"
