    fix_effort: low
  - id: enqueue_after_transaction_commit
    pattern: "\\benqueue_after_transaction_commit\\b"
    message: "'config.active_job.enqueue_after_transaction_commit' was removed in Rails 8.1. Jobs always enqueue after the transaction commits."
    removed_in: "8.1"
