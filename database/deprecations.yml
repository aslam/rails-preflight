  - id: stats_directories
    pattern: "\\bSTATS_DIRECTORIES\\b"
    message: "'STATS_DIRECTORIES' and 'bin/rake stats' were removed in Rails 8.1. Use an external tool such as rubocop or a line counter."
    removed_in: "8.1"
