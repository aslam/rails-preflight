deprecations:
  - id: update_attributes
    pattern: "update_attributes!?"
    message: "DEPRECATION: 'update_attributes' was removed in Rails 6.1. Use 'update' instead."
    removed_in: "6.1"
    severity: error
    confidence: "High"
    guide_link: "https://guides.rubyonrails.org/upgrading_ruby_on_rails.html#upgrading-from-rails-6-0-to-6-1"
    recategorization: "Rails 6.0 -> 6.1"
    fix_effort: low
  - id: assert_response_success
    pattern: "assert_response :success"
    message: "INFO: Verify controller tests use kwargs (e.g. get :index, params: { ... })"
    removed_in: "5.0"
    severity: info
    confidence: "Medium"
    guide_link: "https://guides.rubyonrails.org/upgrading_ruby_on_rails.html#upgrading-from-rails-5-0-to-5-1"
    recategorization: "Rails 5.0 -> 5.1"
    fix_effort: low
