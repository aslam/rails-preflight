# Public gems whose gemspec doesn't state their Rails limit, so Bundler won't warn before the upgrade breaks.
# Each entry cites where its limit comes from. Constraints a gemspec does declare are read from Gemfile.lock instead.
#   breaks_in: first Rails minor the gem doesn't work on; a blocker on that hop. Omitted for gems that are
#              retired or deprecated but still run: fix them when convenient.
#   pattern:   optional; counts the files that use the gem, so the report shows how big the move is.
gems:
  - name: protected_attributes_continued
    breaks_in: "7.0"
    message: "supports Rails 5.0 to 6.1 only and won't be updated for 7.0. Move to strong parameters."
    source: "https://github.com/westonganger/protected_attributes_continued#readme"
    pattern: "^\\s*attr_(?:accessible|protected)\\b"
    fix_effort: high
  - name: paperclip
    message: "is deprecated and archived. Move to Active Storage, or to the maintained kt-paperclip fork."
    source: "https://github.com/thoughtbot/paperclip#deprecated"
    pattern: "^\\s*(?:has_attached_file|validates_attachment\\w*)\\b"
    fix_effort: high
  - name: webpacker
    message: "was retired after Rails 7.0. Move to jsbundling-rails or import maps, or to shakapacker to keep webpack."
    source: "https://github.com/rails/webpacker#readme"
    pattern: "\\b(?:javascript|stylesheet)_pack_tag\\b"
    fix_effort: medium
  - name: therubyracer
    message: "is unmaintained and stuck on V8 3.16. Move to mini_racer, or drop it if Node.js is available to ExecJS."
    source: "https://github.com/rubyjs/therubyracer#readme"
    fix_effort: low
  - name: turbolinks
    message: "is archived and superseded by Turbo (turbo-rails), the default since Rails 7.0."
    source: "https://github.com/turbolinks/turbolinks#readme"
    fix_effort: medium
  - name: sass
    message: "(Ruby Sass) is archived and gets no updates. Move to dartsass-rails (sassc, the replacement its README names, is archived too)."
    source: "https://github.com/sass/ruby-sass#readme"
    fix_effort: low
  - name: sassc
    message: "is archived and gets no updates. Move to dartsass-rails or dartsass-sprockets, or to sassc-embedded as a drop-in."
    source: "https://github.com/sass/sassc-ruby#readme"
    fix_effort: low

# Database adapter gems Rails checks itself when it loads the adapter (`gem "pg", "~> 1.1"`), so no gemspec
# declares the limit. Read from activerecord/lib/active_record/connection_adapters/*_adapter.rb on each
# X-Y-stable branch; a locked adapter outside the range blocks that hop.
adapter_requirements:
  "5.1": { sqlite3: ["~> 1.3", ">= 1.3.6"], mysql2: [">= 0.3.18", "< 0.6.0"], pg: [">= 0.18", "< 2.0"] }
  "5.2": { sqlite3: ["~> 1.3", ">= 1.3.6"], mysql2: [">= 0.4.4", "< 0.6.0"], pg: [">= 0.18", "< 2.0"] }
  "6.0": { sqlite3: ["~> 1.4"], mysql2: [">= 0.4.4"], pg: [">= 0.18", "< 2.0"] }
  "6.1": { sqlite3: ["~> 1.4"], mysql2: ["~> 0.5"], pg: ["~> 1.1"] }
  "7.0": { sqlite3: ["~> 1.4"], mysql2: ["~> 0.5"], pg: ["~> 1.1"] }
  "7.1": { sqlite3: [">= 1.4"], mysql2: ["~> 0.5"], pg: ["~> 1.1"], trilogy: ["~> 2.4"] }
  "7.2": { sqlite3: [">= 1.4"], mysql2: ["~> 0.5"], pg: ["~> 1.1"], trilogy: ["~> 2.7"] }
  "8.0": { sqlite3: [">= 2.1"], mysql2: ["~> 0.5"], pg: ["~> 1.1"], trilogy: ["~> 2.7"] }
  "8.1": { sqlite3: [">= 2.1"], mysql2: ["~> 0.5"], pg: ["~> 1.1"], trilogy: ["~> 2.7"] }

# Gems the rails gem stopped depending on, from rails.gemspec on each X-Y-stable branch. An app that gets one
# only through rails loses it on that hop: without sprockets-rails, `config.assets` raises on boot.
dropped_by_rails:
  "7.0": [sprockets-rails]
